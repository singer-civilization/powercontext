app:
  description: 一间会记住你的酒馆——NPC 记得你上次点的酒、说过的话，下次进门接着聊。
  icon: 🍺
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 记忆酒馆 Memory Tavern
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables:
  - name: POWERCONTEXT_URL
    value: http://host.docker.internal:8000
    value_type: string
  - name: POWERCONTEXT_SCOPE_ID
    value: ''
    value_type: string
  features:
    file_upload: {enabled: false}
    opening_statement: 推开吱呀作响的木门，老板抬头：“又见面了。”
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions:
    - 老板，还记得我上次点什么吗？
    - 给我讲讲这间酒馆的规矩
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false}
  graph:
    edges:
    - {data: {isInIteration: false, isInLoop: false, sourceType: start, targetType: code}, id: e1, source: start_node, sourceHandle: source, target: recall_build, targetHandle: target, type: custom, zIndex: 0}
    - {data: {isInIteration: false, isInLoop: false, sourceType: code, targetType: http-request}, id: e2, source: recall_build, sourceHandle: source, target: recall_node, targetHandle: target, type: custom, zIndex: 0}
    - {data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: code}, id: e3, source: recall_node, sourceHandle: source, target: compose_node, targetHandle: target, type: custom, zIndex: 0}
    - {data: {isInIteration: false, isInLoop: false, sourceType: code, targetType: http-request}, id: e4, source: compose_node, sourceHandle: source, target: llm_node, targetHandle: target, type: custom, zIndex: 0}
    - {data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: code}, id: e5, source: llm_node, sourceHandle: source, target: parse_node, targetHandle: target, type: custom, zIndex: 0}
    - {data: {isInIteration: false, isInLoop: false, sourceType: code, targetType: http-request}, id: e6, source: parse_node, sourceHandle: source, target: remember_node, targetHandle: target, type: custom, zIndex: 0}
    - {data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: answer}, id: e7, source: remember_node, sourceHandle: source, target: answer_node, targetHandle: target, type: custom, zIndex: 0}
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - {label: 客人说的话, max_length: 512, options: [], required: true, type: paragraph, variable: question}
      height: 90
      id: start_node
      position: {x: 0, y: 245}
      positionAbsolute: {x: 0, y: 245}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code_language: javascript
        code: |
          function main({ question, url, scope }) {
            if (!scope) throw new Error("请先在应用环境变量里设置 POWERCONTEXT_SCOPE_ID");
            return { body: JSON.stringify({ scope_id: scope, query: question, limit: 5, mode: "auto" }), url: url };
          }
        desc: 用 JSON.stringify 拼检索请求，避免把用户输入直接插进 JSON
        outputs:
          body: {type: string, children: null}
          url: {type: string, children: null}
        selected: false
        title: 拼回忆请求
        type: code
        variables:
        - {value_selector: [start_node, question], variable: question}
        - {value_selector: [env, POWERCONTEXT_URL], variable: url}
        - {value_selector: [env, POWERCONTEXT_SCOPE_ID], variable: scope}
      height: 90
      id: recall_build
      position: {x: 260, y: 245}
      positionAbsolute: {x: 260, y: 245}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 从 PowerContext 取回与本次发言相关的旧记忆
        title: 回忆
        type: http-request
        method: POST
        url: '{{#recall_build.url#}}/v1/memory/search'
        authorization: {type: no-auth}
        headers: 'Content-Type: application/json'
        params: ''
        body:
          type: raw-text
          data: '{{#recall_build.body#}}'
        timeout: {connect: 10, read: 30, write: 30}
        retry_config: {enabled: false, max_retries: 1, retry_interval: 1000, exponential_backoff: {enabled: false, multiplier: 2, max_interval: 10000}}
      height: 90
      id: recall_node
      position: {x: 520, y: 245}
      positionAbsolute: {x: 520, y: 245}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code_language: javascript
        code: |
          function main({ question, memory }) {
            let mem = "";
            try {
              const hits = (JSON.parse(memory).hits) || [];
              mem = hits.map(h => "- " + String(h.text || "").replace(/\n/g, " ").slice(0, 160)).join("\n");
            } catch (e) { mem = ""; }
            const system = "你是「记忆酒馆」的老板，开了四十年店的老酒保。说话简短、有点冷幽默，每次回答不超过 80 个汉字。\n" +
              "下面是你记得的、和这位客人有关的旧事（可能为空）：\n" + (mem || "（没有任何记录）") + "\n" +
              "规则：记忆里出现过这位客人的偏好、点过的酒或心事，就自然带进对话，不要生硬复述；记忆为空就当第一次见，问他一句来历；不要解释你是 AI。";
            return { payload: JSON.stringify({ model: "MiniMax-M3.1-Flash", messages: [{role:"system",content:system},{role:"user",content:question}], temperature: 0.8, max_tokens: 512 }) };
          }
        desc: 把旧记忆和这句话拼成 MiniMax 请求体（JSON.stringify，不拼字符串）
        outputs:
          payload: {type: string, children: null}
        selected: false
        title: 拼生成请求
        type: code
        variables:
        - {value_selector: [start_node, question], variable: question}
        - {value_selector: [recall_node, body], variable: memory}
      height: 90
      id: compose_node
      position: {x: 780, y: 245}
      positionAbsolute: {x: 780, y: 245}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 调用 MiniMax（OpenAI 兼容接口）
        title: MiniMax 生成
        type: http-request
        method: POST
        url: https://api.minimaxi.com/v1/chat/completions
        authorization:
          type: api-key
          config: {type: bearer, api_key: __MINIMAX_API_KEY__}
        headers: 'Content-Type: application/json'
        params: ''
        body: {type: raw-text, data: '{{#compose_node.payload#}}'}
        timeout: {connect: 10, read: 120, write: 30}
        retry_config: {enabled: false, max_retries: 1, retry_interval: 1000, exponential_backoff: {enabled: false, multiplier: 2, max_interval: 10000}}
      height: 90
      id: llm_node
      position: {x: 1040, y: 245}
      positionAbsolute: {x: 1040, y: 245}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code_language: javascript
        code: |
          function main({ body, question, scope }) {
            const data = JSON.parse(body);
            const message = (data.choices && data.choices[0] && data.choices[0].message) || {};
            const text = String(message.content || "").trim();
            return {
              text,
              remember_body: JSON.stringify({ scope_id: scope, kind: "tavern_turn", text: "客人说：" + question + " / 老板答：" + text, reason: "记住酒馆里这一轮对话，供下次进店复用" })
            };
          }
        desc: 取回答，同时用 JSON.stringify 拼写回请求
        outputs:
          text: {type: string, children: null}
          remember_body: {type: string, children: null}
        selected: false
        title: 取回答并拼写回
        type: code
        variables:
        - {value_selector: [llm_node, body], variable: body}
        - {value_selector: [start_node, question], variable: question}
        - {value_selector: [env, POWERCONTEXT_SCOPE_ID], variable: scope}
      height: 90
      id: parse_node
      position: {x: 1300, y: 245}
      positionAbsolute: {x: 1300, y: 245}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 把这一轮写回 PowerContext
        title: 记住这一轮
        type: http-request
        method: POST
        url: '{{#env.POWERCONTEXT_URL#}}/v1/memory/remember'
        authorization: {type: no-auth}
        headers: 'Content-Type: application/json'
        params: ''
        body: {type: raw-text, data: '{{#parse_node.remember_body#}}'}
        timeout: {connect: 10, read: 30, write: 30}
        retry_config: {enabled: false, max_retries: 1, retry_interval: 1000, exponential_backoff: {enabled: false, multiplier: 2, max_interval: 10000}}
      height: 90
      id: remember_node
      position: {x: 1560, y: 245}
      positionAbsolute: {x: 1560, y: 245}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#parse_node.text#}}'
        desc: ''
        selected: false
        title: 回答
        type: answer
        variables: []
      height: 90
      id: answer_node
      position: {x: 1820, y: 245}
      positionAbsolute: {x: 1820, y: 245}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport: {x: 0, y: 0, zoom: 0.7}
