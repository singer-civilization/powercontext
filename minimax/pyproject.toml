[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdd-context-lab"
version = "0.1.0"
description = "MiniMax + seekdb + PowerContext engineering context demo for SDD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pylibseekdb>=1.4.0.post1,<2",
  "pymysql>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
sdd-context = "sdd_context.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sdd_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
